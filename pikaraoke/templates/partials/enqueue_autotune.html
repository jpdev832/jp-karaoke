{# Compact per-song Auto-Tune opts for enqueue / download forms. Off by default. #}
<div id="enqueue-autotune" class="box has-background-black-bis mt-3 mb-3 p-3">
  <label class="checkbox is-flex is-align-items-center mb-2">
    <input type="checkbox" id="at-enqueue-enabled" name="autotune_enabled" value="1" class="mr-2" />
    <strong>Use Auto-Tune for this song</strong>
  </label>
  <div id="at-enqueue-settings" class="is-hidden">
    <div class="columns is-mobile is-multiline">
      <div class="column is-half-mobile is-one-quarter-tablet">
        <label class="label is-size-7">Key</label>
        <div class="select is-small is-fullwidth">
          <select id="at-enqueue-key" name="autotune_key">
            {% for k in ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'] %}
            <option value="{{ k }}" {% if k == 'C' %}selected{% endif %}>{{ k }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="column is-half-mobile is-one-quarter-tablet">
        <label class="label is-size-7">Scale</label>
        <div class="select is-small is-fullwidth">
          <select id="at-enqueue-scale" name="autotune_scale">
            <option value="major" selected>Major</option>
            <option value="minor">Minor</option>
            <option value="chromatic">Chromatic</option>
          </select>
        </div>
      </div>
      <div class="column is-half-mobile is-one-quarter-tablet">
        <label class="label is-size-7">Retune <span id="at-enqueue-speed-val">0.35</span></label>
        <input type="range" id="at-enqueue-speed" name="autotune_correction_speed"
               min="0" max="1" step="0.01" value="0.35" class="is-fullwidth" />
      </div>
      <div class="column is-half-mobile is-one-quarter-tablet">
        <label class="label is-size-7">Mix <span id="at-enqueue-mix-val">1.00</span></label>
        <input type="range" id="at-enqueue-mix" name="autotune_wet_dry_mix"
               min="0" max="1" step="0.01" value="1.0" class="is-fullwidth" />
      </div>
    </div>
    <p class="help has-text-grey">Applies only while your song plays, then turns off.</p>
  </div>
</div>
<script>
(function () {
  function syncEnqueueAutotuneUI() {
    var on = $("#at-enqueue-enabled").is(":checked");
    $("#at-enqueue-settings").toggleClass("is-hidden", !on);
  }
  $(document).on("change", "#at-enqueue-enabled", syncEnqueueAutotuneUI);
  $(document).on("input", "#at-enqueue-speed", function () {
    $("#at-enqueue-speed-val").text(Number(this.value).toFixed(2));
  });
  $(document).on("input", "#at-enqueue-mix", function () {
    $("#at-enqueue-mix-val").text(Number(this.value).toFixed(2));
  });
  window.readEnqueueAutotune = function () {
    if (!$("#at-enqueue-enabled").is(":checked")) return null;
    return {
      enabled: true,
      key: $("#at-enqueue-key").val() || "C",
      scale: $("#at-enqueue-scale").val() || "major",
      correction_speed: Number($("#at-enqueue-speed").val() || 0.35),
      wet_dry_mix: Number($("#at-enqueue-mix").val() || 1.0),
    };
  };
  window.enqueueAutotuneQuery = function () {
    var at = window.readEnqueueAutotune && window.readEnqueueAutotune();
    if (!at) return "";
    return "&autotune=" + encodeURIComponent(JSON.stringify(at));
  };
  syncEnqueueAutotuneUI();
})();
</script>
